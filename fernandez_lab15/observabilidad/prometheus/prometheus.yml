global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: "config-server"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["127.0.0.1:8888"]

  - job_name: "eureka-server"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["127.0.0.1:8761"]

  - job_name: "gateway-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["127.0.0.1:8080"]

  - job_name: "categoria-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["127.0.0.1:8082"]

  - job_name: "producto-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["127.0.0.1:8083"]

  - job_name: "cliente-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["127.0.0.1:8084"]

  - job_name: "pedido-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["127.0.0.1:8085"]
