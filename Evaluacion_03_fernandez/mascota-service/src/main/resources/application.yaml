spring:
  application:
    name: mascota-service

  datasource:
    url: jdbc:mysql://localhost:3306/bd_mascota
    username: root
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

services:
  propietario:
    url: http://localhost:8081/api/propietarios
