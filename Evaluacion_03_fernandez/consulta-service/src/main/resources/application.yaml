spring:
  application:
    name: consulta-service

  datasource:
    url: jdbc:mysql://localhost:3306/bd_consulta
    username: root
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8083

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

services:
  mascota:
    url: http://localhost:8082/api/mascotas
